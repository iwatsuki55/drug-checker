<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相互作用チェッカー | Drug Interaction Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f7f5;
    --bg2: #e6f2ef;
    --surface: #ffffff;
    --border: #c8e3dc;
    --border2: #ddeee9;
    --text: #1a3a30;
    --text2: #3a6458;
    --muted: #6a9e90;
    --dim: #a0c4bb;
    --teal: #0d9e7e;
    --teal2: #0bb896;
    --teal-light: #e0f5f0;
    --sage: #52a98b;
    --mint: #b8ede0;
    --red: #e05252;
    --orange: #e07a30;
    --yellow: #c9960a;
    --green: #2a9d6e;
    --shadow: 0 2px 12px rgba(13,158,126,0.08);
    --shadow2: 0 4px 24px rgba(13,158,126,0.13);
    --font: 'Nunito', 'Noto Sans JP', sans-serif;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(13,158,126,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(82,169,139,0.05) 0%, transparent 50%);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--teal), var(--teal2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 12px rgba(13,158,126,0.35);
    flex-shrink: 0;
  }
  .header-title { font-size: 16px; font-weight: 800; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; font-weight: 500; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 2px rgba(42,157,110,0.2);
    animation: pulse 2s infinite;
  }
  .status-label { font-size: 11px; color: var(--green); font-weight: 600; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  /* ── メイン ── */
  main { max-width: 740px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── カード ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-label {
    font-size: 11px; color: var(--muted);
    font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-label::before {
    content: ''; width: 3px; height: 12px;
    background: var(--teal); border-radius: 2px;
  }

  /* ── 入力行 ── */
  .drug-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .drug-num {
    font-size: 11px; color: var(--dim); min-width: 22px;
    text-align: center; font-weight: 700;
    background: var(--teal-light); border-radius: 50%;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .drug-input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
  }
  .drug-input:focus {
    border-color: var(--teal);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(13,158,126,0.1);
  }
  .drug-input::placeholder { color: var(--dim); font-weight: 400; }
  .btn-remove {
    width: 28px; height: 28px;
    background: #fff; border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--dim);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .btn-remove:hover { border-color: #e05252; color: #e05252; background: #fff5f5; }
  .btn-remove:disabled { cursor: default; opacity: 0.3; }

  .btn-add {
    background: var(--teal-light);
    border: 1.5px dashed var(--teal);
    border-radius: 10px; padding: 8px 16px;
    color: var(--teal); font-size: 13px;
    font-family: var(--font); font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-add:hover { background: var(--mint); }

  /* ── 実行ボタン ── */
  .btn-run {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--teal), var(--teal2));
    border: none; border-radius: 14px;
    color: #fff; font-size: 15px; font-weight: 800;
    font-family: var(--font); cursor: pointer;
    letter-spacing: 0.03em; margin-bottom: 24px;
    box-shadow: 0 6px 20px rgba(13,158,126,0.35);
    transition: all 0.2s;
  }
  .btn-run:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(13,158,126,0.4); }
  .btn-run:active { transform: translateY(0); }
  .btn-run:disabled {
    background: var(--border);
    color: var(--dim); cursor: default;
    box-shadow: none; transform: none;
  }

  /* ── エラー ── */
  .error-box {
    background: #fff5f5;
    border: 1.5px solid #f5c0c0;
    border-radius: 12px; padding: 12px 16px;
    font-size: 13px; color: #c04040;
    margin-bottom: 16px; font-weight: 500;
  }

  /* ── ローディング ── */
  .loading-card { text-align: center; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--teal);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
  }
  .loading-step { font-size: 14px; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
  .loading-sub { font-size: 12px; color: var(--muted); }

  /* ── 正規化バッジ ── */
  .normalized-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .drug-badge {
    background: var(--teal-light);
    border: 1.5px solid var(--mint);
    border-radius: 10px; padding: 7px 12px;
    font-size: 12px;
  }
  .drug-badge .generic { color: var(--teal); font-weight: 700; }
  .drug-badge .original { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .drug-badge .class { color: var(--muted); font-size: 10px; font-weight: 600; }

  /* ── リスクサマリー ── */
  .risk-card {
    border-left: 4px solid;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 16px;
  }
  .risk-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .risk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .risk-label { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
  .risk-count { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 600; }
  .risk-summary { font-size: 13px; color: var(--text2); line-height: 1.85; font-weight: 500; }

  /* ── 相互作用アイテム ── */
  .interaction-item { border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .interaction-header {
    width: 100%; background: transparent; border: none;
    padding: 14px 18px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    text-align: left; color: var(--text);
    font-family: var(--font); transition: all 0.15s;
  }
  .interaction-header:hover { filter: brightness(0.97); }
  .interaction-icon { font-size: 16px; flex-shrink: 0; }
  .interaction-title { flex: 1; }
  .drug-names { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
  .drug-name { font-size: 14px; font-weight: 700; }
  .drug-sep { font-size: 12px; color: var(--muted); }
  .sev-badge { font-size: 11px; border-radius: 6px; padding: 2px 8px; border: 1.5px solid; font-weight: 700; }
  .onset-badge {
    font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 7px; background: #fff; font-weight: 600;
  }
  .evidence-label { font-size: 10px; color: var(--muted); margin-left: auto; font-weight: 600; }
  .interaction-effect { font-size: 12px; color: var(--text2); font-weight: 500; }
  .toggle-arrow { font-size: 12px; color: var(--dim); transition: transform 0.2s; flex-shrink: 0; }
  .toggle-arrow.open { transform: rotate(180deg); }

  .interaction-detail { padding: 0 18px 18px; border-top: 1px solid; }
  .detail-row { padding-top: 14px; }
  .detail-label {
    font-size: 10px; color: var(--muted); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;
  }
  .detail-value { font-size: 13px; line-height: 1.75; font-weight: 500; }
  .detail-ref { font-size: 11px; color: var(--dim); margin-top: 5px; }

  /* ── no-interaction ── */
  .no-interaction {
    text-align: center; padding: 32px;
    background: linear-gradient(135deg, #f0fff8, #e8f8f2);
    border: 1.5px solid var(--mint);
    border-radius: 16px;
  }
  .no-interaction .check { font-size: 32px; margin-bottom: 8px; }
  .no-interaction .msg { font-size: 15px; color: var(--green); font-weight: 700; }
  .no-interaction .sub { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }

  /* ── 推奨・モニタリング ── */
  .list-item {
    display: flex; gap: 10px; font-size: 13px;
    color: var(--text2); line-height: 1.75; padding: 6px 0;
    border-bottom: 1px solid var(--border2); font-weight: 500;
  }
  .list-item:last-child { border-bottom: none; }
  .list-arrow { color: var(--teal); flex-shrink: 0; font-weight: 700; }

  /* ── 注意書き ── */
  .disclaimer {
    margin-top: 20px; padding: 14px 18px;
    background: #fffbea;
    border: 1.5px solid #f0d080;
    border-radius: 12px;
    font-size: 12px; color: #7a6020; line-height: 1.8; font-weight: 500;
  }

  /* ── アニメーション ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:1; box-shadow: 0 0 0 2px rgba(42,157,110,0.2); } 50% { opacity:.6; box-shadow: 0 0 0 4px rgba(42,157,110,0.1); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .fade-up { animation: fadeUp 0.4s ease; }
</style>
</head>
<body>

<header>
  <div class="logo">Rx</div>
  <div>
    <div class="header-title">飲み合わせチェッカー</div>
    <div class="header-sub">薬・食品・サプリの組み合わせを確認できます</div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-label">CLAUDE POWERED</span>
  </div>
</header>

<main>
  <!-- モード切り替え -->
  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <button id="btn-mode-pharmacist" onclick="setMode('pharmacist')" style="flex:1;padding:11px;border-radius:12px;border:2px solid var(--teal);background:var(--teal-light);color:var(--teal);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;">
      💊 薬剤師・医療従事者向け
    </button>
    <button id="btn-mode-public" onclick="setMode('public')" style="flex:1;padding:11px;border-radius:12px;border:2px solid var(--border);background:#fff;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;">
      🙋 一般の方向け
    </button>
  </div>

  <!-- 入力セクション -->
  <div class="card" id="input-card">
    <div class="card-label">01 / 入力（薬剤・食品・サプリメント 混在OK）</div>
    <div id="drug-list"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
      <button class="btn-add" id="btn-add">+ 追加</button>
      <span style="font-size:11px;color:var(--dim);" id="drug-count">2/10</span>
    </div>
  </div>

  <!-- エラー -->
  <div class="error-box" id="error-box" style="display:none;"></div>

  <!-- 実行ボタン -->
  <button class="btn-run" id="btn-run">▶ 飲み合わせを確認</button>

  <!-- ローディング -->
  <div class="card loading-card" id="loading-card" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-step" id="loading-step">エージェント①：薬剤名・食品・サプリを正規化中...</div>
    <div class="loading-sub">製品名→一般名の変換・食品・サプリメントの標準化をしています</div>
  </div>

  <!-- 結果 -->
  <div id="result-area" style="display:none;" class="fade-up"></div>
</main>

<script>
// ── 設定 ──
const API_BASE = "https://drug-checker-api.onrender.com";

// ── モード管理 ──
let currentMode = "pharmacist";

function setMode(mode) {
  currentMode = mode;
  const btnP   = document.getElementById("btn-mode-pharmacist");
  const btnPub = document.getElementById("btn-mode-public");
  if (mode === "pharmacist") {
    btnP.style.background   = "var(--teal-light)";
    btnP.style.borderColor  = "var(--teal)";
    btnP.style.color        = "var(--teal)";
    btnPub.style.background = "#fff";
    btnPub.style.borderColor= "var(--border)";
    btnPub.style.color      = "var(--muted)";
  } else {
    btnPub.style.background = "#f0fff8";
    btnPub.style.borderColor= "var(--sage)";
    btnPub.style.color      = "var(--sage)";
    btnP.style.background   = "#fff";
    btnP.style.borderColor  = "var(--border)";
    btnP.style.color        = "var(--muted)";
  }
}

// ── 一般向けラベル変換 ──
const SEV_PUBLIC = {
  contraindicated: { label:"危険な組み合わせ", color:"#ff4444", bg:"rgba(255,68,68,0.1)",   border:"rgba(255,68,68,0.3)",   icon:"⛔" },
  major:           { label:"要注意",           color:"#ff8c00", bg:"rgba(255,140,0,0.1)",   border:"rgba(255,140,0,0.3)",   icon:"⚠️" },
  moderate:        { label:"注意",             color:"#f0b429", bg:"rgba(240,180,41,0.1)",  border:"rgba(240,180,41,0.3)",  icon:"⚡" },
  minor:           { label:"軽い注意",         color:"#4caf8a", bg:"rgba(76,175,138,0.1)", border:"rgba(76,175,138,0.3)", icon:"ℹ️" },
};

// ── 重篤度設定 ──
const SEV = {
  contraindicated: { label:"禁忌",   color:"#ff4444", bg:"rgba(255,68,68,0.1)",   border:"rgba(255,68,68,0.3)",   icon:"⛔" },
  major:           { label:"重大",   color:"#ff8c00", bg:"rgba(255,140,0,0.1)",   border:"rgba(255,140,0,0.3)",   icon:"⚠️" },
  moderate:        { label:"中程度", color:"#f0b429", bg:"rgba(240,180,41,0.1)",  border:"rgba(240,180,41,0.3)",  icon:"⚡" },
  minor:           { label:"軽微",   color:"#4caf8a", bg:"rgba(76,175,138,0.1)", border:"rgba(76,175,138,0.3)", icon:"ℹ️" },
};
const RISK = {
  high:     { label:"高リスク", color:"#ff4444" },
  moderate: { label:"要注意",   color:"#f0b429" },
  low:      { label:"低リスク", color:"#4caf8a" },
  none:     { label:"問題なし", color:"#7aa4c8" },
};
const ONSET_LABEL = { immediate:"即時", delayed:"遅延", unknown:"不明" };

// ── 状態 ──
let drugs = ["", ""];
let expandedIdx = null;

// ── DOM ──
const drugListEl  = document.getElementById("drug-list");
const drugCountEl = document.getElementById("drug-count");
const btnAdd      = document.getElementById("btn-add");
const btnRun      = document.getElementById("btn-run");
const errorBox    = document.getElementById("error-box");
const loadingCard = document.getElementById("loading-card");
const loadingStep = document.getElementById("loading-step");
const resultArea  = document.getElementById("result-area");

function renderInputs() {
  drugListEl.innerHTML = "";
  drugs.forEach((d, i) => {
    const row = document.createElement("div");
    row.className = "drug-row";
    row.innerHTML = `
      <span class="drug-num">${String(i+1).padStart(2,"0")}</span>
      <input class="drug-input" type="text" value="${d}"
        placeholder="薬剤・食品・サプリ ${i+1}（例：ワーファリン、納豆、グレープフルーツ）"
        data-idx="${i}" />
      <button class="btn-remove" data-idx="${i}" ${drugs.length<=2?"disabled":""}>×</button>
    `;
    drugListEl.appendChild(row);
  });
  drugCountEl.textContent = `${drugs.length}/10`;
  btnAdd.disabled = drugs.length >= 10;
  updateRunBtn();
}

function updateRunBtn() {
  const valid = drugs.filter(d => d.trim()).length;
  btnRun.disabled = valid < 2;
  btnRun.textContent = `▶ ${valid}件の相互作用を解析`;
}

// イベント委譲
drugListEl.addEventListener("input", e => {
  if (e.target.matches(".drug-input")) {
    drugs[+e.target.dataset.idx] = e.target.value;
    updateRunBtn();
  }
});
drugListEl.addEventListener("click", e => {
  if (e.target.matches(".btn-remove") && !e.target.disabled) {
    drugs.splice(+e.target.dataset.idx, 1);
    renderInputs();
  }
});
drugListEl.addEventListener("keydown", e => {
  if (e.target.matches(".drug-input") && e.key === "Enter") {
    const idx = +e.target.dataset.idx;
    if (idx === drugs.length - 1 && drugs.length < 10) {
      drugs.push("");
      renderInputs();
      setTimeout(() => drugListEl.querySelectorAll(".drug-input")[idx+1]?.focus(), 50);
    }
  }
});
btnAdd.addEventListener("click", () => {
  if (drugs.length < 10) { drugs.push(""); renderInputs(); }
});

// ── 解析実行 ──
btnRun.addEventListener("click", async () => {
  const valid = drugs.map(d => d.trim()).filter(Boolean);
  if (valid.length < 2) { showError("2剤以上入力してください"); return; }

  hideError();
  resultArea.style.display = "none";
  loadingCard.style.display = "block";
  loadingStep.textContent = "エージェント①：薬剤名を正規化中...";
  btnRun.disabled = true;
  expandedIdx = null;

  // Step1完了後のUI更新（タイミングのみ）
  setTimeout(() => {
    loadingStep.textContent = "エージェント②：相互作用を解析中...";
  }, 3000);

  try {
    const res = await fetch(`${API_BASE}/api/check`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ drugs: valid, mode: currentMode })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "サーバーエラー");

    loadingCard.style.display = "none";
    renderResult(data);
  } catch(e) {
    loadingCard.style.display = "none";
    showError("エラー: " + e.message + "\n（バックエンドが起動しているか確認してください）");
  } finally {
    btnRun.disabled = false;
    updateRunBtn();
  }
});

// ── 結果描画 ──
function renderResult(data) {
  const isPublic = data.mode === "public";
  const sevConfig = isPublic ? SEV_PUBLIC : SEV;
  const risk = RISK[data.risk_level] || RISK.none;
  let html = "";

  // ── 正規化結果 ──
  if (data.normalized?.length) {
    html += `<div class="card"><div class="card-label">Step 1 / 正規化結果</div>
    <div class="normalized-list">`;
    const categoryLabel = { drug:"💊 薬剤", food:"🥦 食品", supplement:"🌿 サプリ" };
    data.normalized.forEach(d => {
      const catLabel = categoryLabel[d.category] || d.category;
      html += `<div class="drug-badge">
        <div class="generic">${d.generic_name_ja}（${d.generic_name_en}）</div>
        <div class="original">入力：${d.input}</div>
        <div class="class">${catLabel}｜${d.drug_class}</div>
      </div>`;
    });
    html += "</div>";
    if (data.unrecognized?.length) {
      html += `<div style="font-size:11px;color:#ff8888;">認識できなかった項目：${data.unrecognized.join("、")}</div>`;
    }
    html += "</div>";
  }

  // ── リスクサマリー ──
  html += `<div class="risk-card card" style="border-left-color:${risk.color};border-color:${risk.color}30;background:${risk.color}08;">
    <div class="risk-header">
      <div class="risk-dot" style="background:${risk.color};box-shadow:0 0 8px ${risk.color};"></div>
      <span class="risk-label" style="color:${risk.color};">総合リスク：${risk.label}</span>
      <span class="risk-count">${data.interactions?.length||0}件の相互作用を検出</span>
    </div>
    <div class="risk-summary">${data.summary||""}</div>
  </div>`;

  // ── 推奨事項 ──
  if (data.recommendations?.length) {
    html += `<div class="card"><div class="card-label">推奨事項</div>`;
    data.recommendations.forEach(r => {
      html += `<div class="list-item"><span class="list-arrow">→</span><span>${r}</span></div>`;
    });
    html += "</div>";
  }

  // ── モニタリング ──
  if (data.monitoring?.length) {
    html += `<div class="card"><div class="card-label">モニタリング項目</div>`;
    data.monitoring.forEach(m => {
      html += `<div class="list-item"><span class="list-arrow">📊</span><span>${m}</span></div>`;
    });
    html += "</div>";
  }

  // ── 相互作用リスト ──
  if (data.interactions?.length) {
    html += `<div class="card-label" style="font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;">Step 2 / 相互作用詳細</div>`;
    data.interactions.forEach((item, i) => {
      const cfg = sevConfig[item.severity] || sevConfig.minor;
      const onsetLabel = ONSET_LABEL[item.onset] || "";
      const detailLabel = isPublic ? "なぜ問題になるか" : "メカニズム";
      const effectLabel = isPublic ? "体への影響" : "臨床的影響";
      const managementLabel = isPublic ? "どうすればいい？" : "対処法・モニタリング";
      html += `
      <div class="interaction-item" style="background:${cfg.bg};border:1px solid ${cfg.border};" id="item-${i}">
        <button class="interaction-header" onclick="toggleItem(${i})">
          <span class="interaction-icon">${cfg.icon}</span>
          <div class="interaction-title">
            <div class="drug-names">
              <span class="drug-name">${item.drug_a}</span>
              <span class="drug-sep">×</span>
              <span class="drug-name">${item.drug_b}</span>
              <span class="sev-badge" style="color:${cfg.color};border-color:${cfg.color}40;background:${cfg.color}15;">${cfg.label}</span>
              ${onsetLabel?`<span class="onset-badge">${onsetLabel}</span>`:""}
              ${!isPublic && item.evidence?`<span class="evidence-label">エビデンス：${item.evidence}</span>`:""}
            </div>
            <div class="interaction-effect">${item.effect||""}</div>
          </div>
          <span class="toggle-arrow" id="arrow-${i}">▾</span>
        </button>
        <div class="interaction-detail" id="detail-${i}" style="display:none;border-top-color:${cfg.border};">
          <div class="detail-row">
            <div class="detail-label">${detailLabel}</div>
            <div class="detail-value" style="color:#7a9ac0;">${item.mechanism||""}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">${effectLabel}</div>
            <div class="detail-value" style="color:#7a9ac0;">${item.effect||""}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">${managementLabel}</div>
            <div class="detail-value" style="color:${cfg.color};">${item.management||""}</div>
          </div>
          ${item.references?`<div class="detail-ref">参考：${item.references}</div>`:""}
        </div>
      </div>`;
    });
  } else {
    html += `<div class="no-interaction">
      <div class="check">✓</div>
      <div class="msg">顕著な相互作用は検出されませんでした</div>
      <div class="sub">引き続き添付文書および専門家の判断による確認を推奨します</div>
    </div>`;
  }

  html += `<div class="disclaimer">⚠️ 本ツールはAIによる参考情報の提供を目的としています。最終的な処方判断・服薬指導は必ず薬剤師・医師が行ってください。添付文書・インタビューフォームを必ず参照し、個々の患者状態を考慮した判断を行ってください。</div>`;

  resultArea.innerHTML = html;
  resultArea.style.display = "block";
  resultArea.className = "fade-up";
  resultArea.scrollIntoView({ behavior: "smooth", block: "start" });
}

function toggleItem(i) {
  const detail = document.getElementById(`detail-${i}`);
  const arrow  = document.getElementById(`arrow-${i}`);
  const isOpen = expandedIdx === i;
  // 全部閉じる
  document.querySelectorAll("[id^='detail-']").forEach(el => el.style.display = "none");
  document.querySelectorAll("[id^='arrow-']").forEach(el => el.classList.remove("open"));
  expandedIdx = null;
  if (!isOpen) {
    detail.style.display = "block";
    arrow.classList.add("open");
    expandedIdx = i;
  }
}

function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function hideError()    { errorBox.style.display = "none"; }

// 初期化
renderInputs();
</script>
</body>
</html>
